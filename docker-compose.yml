version: '1.29.2'
services:
  postgres:
    image: postgres:14
    container_name: ubuntu_postgres_1
    environment:
      POSTGRES_USER: postgresAdmin
      POSTGRES_PASSWORD: postgresAdmin
      POSTGRES_DB: ptde2403_mbd_jackson_mothapo_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
  webserver:
    image: apache/airflow:2.1.2
    environment:
      - AIRFLOW__CORE__FERNET_KEY='sM2iXN1Mw0ZMfJwozN24kyfPRcfTqnEtBNn1Qs6fDVE='
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - postgres
      - redis
  scheduler:
    image: apache/airflow:2.1.2
    environment:
      - AIRFLOW__CORE__FERNET_KEY='sM2iXN1Mw0ZMfJwozN24kyfPRcfTqnEtBNn1Qs6fDVE='
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - postgres
      - redis
  worker:
    image: apache/airflow:2.1.2
    environment:
      - AIRFLOW__CORE__FERNET_KEY='sM2iXN1Mw0ZMfJwozN24kyfPRcfTqnEtBNn1Qs6fDVE='
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    depends_on:
      - webserver
      - scheduler
volumes:
  postgres_data:
